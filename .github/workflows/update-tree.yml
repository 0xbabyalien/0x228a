- name: Generate Directory Tree
        run: |
          # Install the tree command if not already available
          sudo apt-get install -y tree
          
          # Generate tree and filter out any lines belonging inside the img folder completely
          TREE_CONTENT=$(tree -I ".git|.github|node_modules" --charset ascii | grep -vE "img/|-- 0xbabyalien|-- 228a|-- IMG_|-- android-|-- c0d|-- favicon|-- icon")
          
          echo "Generated tree:"
          echo "$TREE_CONTENT"
          
          # Save the tree content directly to a .txt file
          echo "$TREE_CONTENT" > directory-structure.txt
          
          # Inject the generated tree into README.md between the markers
          python3 -c "
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          start_marker = '<!-- START_SECTION:tree -->'
          end_marker = '<!-- END_SECTION:tree -->'
          
          if start_marker in content and end_marker in content:
              start_idx = content.find(start_marker) + len(start_marker)
              end_idx = content.find(end_marker)
              
              new_tree = '\n' + '''$TREE_CONTENT''' + '\n'
              new_content = content[:start_idx] + new_tree + content[end_idx:]
              
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('README.md successfully updated!')
          else:
              print('Markers not found in README.md')
          "
